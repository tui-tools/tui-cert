<VirtualHost *:443>
    ServerName intranet.example.internal
    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/intranet.example.internal.crt
    SSLCertificateKeyFile   /etc/pki/tls/private/intranet.example.internal.key
    SSLCertificateChainFile /etc/pki/tls/certs/internal-ca.crt
</VirtualHost>
