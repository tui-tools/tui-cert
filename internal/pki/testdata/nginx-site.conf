# A site as nginx ships it, with the comment forms that appear in the wild.
server {
    listen 443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    # ssl_certificate /etc/ssl/private/commented-out.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/shop.example.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;  # not a path

    location / { proxy_pass http://127.0.0.1:3000; }
}

server {
    listen 443 ssl;
    server_name templated.example.com;
    # A value built from a variable is not a file, and is skipped.
    ssl_certificate     /etc/ssl/certs/$ssl_server_name.pem;
    ssl_certificate_key /etc/ssl/private/$ssl_server_name.key;
}
